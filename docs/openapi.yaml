openapi: 3.0.3
info:
  title: Portfolio content API
  version: 1.0.0
  description: |
    Read-only API that a future backend implements so the site can run with
    `VITE_DATA_SOURCE=api` (see decisions/0002 and docs/backend-api.md).
    Schemas mirror `frontend/src/types/portfolio.ts`; keep the two in line.
    Each response body has the same shape as the matching file in `frontend/public/data/`.
servers:
  - url: /
    description: Same origin. nginx proxies `/api/` to the backend (default, `VITE_API_BASE_URL` empty).
  - url: '{apiBaseUrl}'
    description: Separate origin set with `VITE_API_BASE_URL` at build time (needs CORS, see docs/backend-api.md).
    variables:
      apiBaseUrl:
        default: https://api.example.com
paths:
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: Profile shown in the hero, about and contact sections
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/skills:
    get:
      operationId: getSkills
      summary: Technical and functional skill groups
      responses:
        '200':
          description: The skill groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skills'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/experience:
    get:
      operationId: getExperience
      summary: Roles timeline, rendered in the order returned (newest first)
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    get:
      operationId: getProjects
      summary: Projects, rendered in the order returned
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: |
        Any non-2xx status. The client only reads the status code and shows a
        retryable error state, so the body is optional. A JSON problem body is
        recommended for debugging.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SocialLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          description: Link text. A link labelled `LinkedIn` also drives the hero button.
          example: LinkedIn
        url:
          type: string
          format: uri
    Stat:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          example: 13+
        label:
          type: string
          example: Years of experience
    Profile:
      type: object
      required: [name, title, currentRole, location, yearsOfExperience, tagline, summary, stats, links]
      properties:
        name: { type: string }
        title: { type: string }
        currentRole: { type: string }
        location: { type: string }
        yearsOfExperience:
          type: string
          example: 13+
        tagline: { type: string }
        summary: { type: string }
        stats:
          type: array
          items: { $ref: '#/components/schemas/Stat' }
        links:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        email:
          type: string
          format: email
          description: Optional. The UI hides it when absent (decisions/0003).
        phone:
          type: string
          description: Optional. The UI hides it when absent (decisions/0003).
    SkillCategory:
      type: object
      required: [category, items]
      properties:
        category:
          type: string
          example: Languages & Core
        items:
          type: array
          items: { type: string }
    Skills:
      type: object
      required: [technical, functional]
      properties:
        technical:
          type: array
          items: { $ref: '#/components/schemas/SkillCategory' }
        functional:
          type: array
          items: { $ref: '#/components/schemas/SkillCategory' }
    Experience:
      type: object
      required: [id, role, employer, client, domain, start, end, highlights, stack]
      properties:
        id:
          type: string
          description: Stable identifier referenced by `Project.experienceId`.
        role: { type: string }
        employer: { type: string }
        client: { type: string }
        domain: { type: string }
        start:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: ISO year-month.
          example: 2024-06
        end:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: ISO year-month, or `null` for the current role (shown as "Present"). The key must be present.
        highlights:
          type: array
          items: { type: string }
        stack:
          type: array
          items: { type: string }
    Impact:
      type: object
      required: [metric, description]
      properties:
        metric:
          type: string
          example: −32%
        description:
          type: string
          example: processing latency
    Project:
      type: object
      required: [id, name, summary, client, employer, domain, projectType, role, experienceId, impact, stack]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string }
        client: { type: string }
        employer: { type: string }
        domain:
          type: string
          description: Used by the projects filter.
        projectType:
          type: string
          description: Used by the projects filter.
        role: { type: string }
        teamSize:
          type: string
          description: Optional.
        experienceId:
          type: string
          description: Must match an `Experience.id`.
        impact:
          type: array
          items: { $ref: '#/components/schemas/Impact' }
        stack:
          type: array
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details (recommended, not read by the client).
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
